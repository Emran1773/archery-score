<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">

<title>ARCHERY SCORE — إنجاز الرامي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

:root[data-theme="dark"] {
  --bg:#050912;
  --bg2:#09111f;
  --card:#0d1728;
  --card2:#111e32;
  --card3:#15243b;
  --line:#20314b;
  --text:#f8fbff;
  --muted:#8291a8;
  --gold:#f4c95d;
  --gold2:#ffe394;
  --green:#38e09b;
  --red:#ff5f78;
  --blue:#5da7ff;
  --shadow:0 25px 70px rgba(0,0,0,.38);
}

:root[data-theme="light"] {
  --bg:#f4f7fc;
  --bg2:#e6ecf5;
  --card:#ffffff;
  --card2:#f0f4f9;
  --card3:#e2e8f0;
  --line:#cbd5e1;
  --text:#0f172a;
  --muted:#64748b;
  --gold:#d97706;
  --gold2:#f59e0b;
  --green:#10b981;
  --red:#ef4444;
  --blue:#3b82f6;
  --shadow:0 15px 45px rgba(0,0,0,.08);
}

:root {
  --radius:22px;
}

html{
  scroll-behavior:smooth
}

body{
  min-height:100vh;
  color:var(--text);
  font-family:"Cairo","Tajawal",sans-serif;
  background:var(--bg);
  transition: background .3s, color .3s;
  overflow-x:hidden;
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:20px 15px 110px;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:28px;
  background:var(--card2);
  border:1px solid var(--gold);
  box-shadow:var(--shadow);
}

.brand h1{
  font-size:23px;
  font-weight:900;
}

.brand p{
  color:var(--muted);
  font-size:11px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:45px;
  height:45px;
  border-radius:14px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--text);
  transition:.2s;
}

.icon-btn:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
}

/* NAV */
.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:7px;
  margin-bottom:17px;
  border-radius:19px;
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(20px);
  position:sticky;
  top:8px;
  z-index:50;
  box-shadow:var(--shadow);
}

.nav button{
  border:0;
  color:var(--muted);
  background:transparent;
  border-radius:13px;
  padding:12px 7px;
  font-size:12px;
  font-weight:800;
  transition:.2s;
}

.nav button:hover{
  color:var(--text);
  background:var(--card2);
}

.nav button.active{
  color:#fff;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 5px 18px rgba(0,0,0,.15);
}

/* PAGES */
.page{
  display:none;
  animation:pageIn .25s ease;
}

.page.active{
  display:block
}

@keyframes pageIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}

/* CARDS */
.card{
  position:relative;
  overflow:hidden;
  padding:18px;
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.card-title h2{
  font-size:16px;
  font-weight:900;
}

.card-title span{
  color:var(--muted);
  font-size:10px;
}

/* SETUP */
.setup{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr 1fr;
  gap:9px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  padding:12px;
  color:var(--text);
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
}

/* LAYOUT */
.grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:14px;
}

/* TARGET FACE INTERACTIVE */
.target-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 15px 0;
}

.target-svg {
  width: 100%;
  max-width: 320px;
  height: auto;
  cursor: pointer;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
  user-select: none;
}

.target-ring {
  transition: opacity 0.15s, transform 0.15s;
}

.target-ring:hover {
  opacity: 0.85;
  stroke: var(--gold);
  stroke-width: 2px;
}

.target-ring:active {
  transform: scale(0.98);
  transform-origin: center;
}

/* SCORE DISPLAY */
.score-hero{
  text-align:center;
  padding:8px 0 18px;
}

.total{
  color:var(--gold);
  font-size:67px;
  line-height:1;
  font-weight:900;
}

.total small{
  color:var(--muted);
  font-size:15px;
}

.percent{
  color:var(--green);
  font-size:13px;
  font-weight:900;
  margin-top:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.stat{
  padding:12px 7px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--card2);
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:900;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:9px;
}

/* CURRENT END */
.current{
  padding:15px;
  margin-bottom:12px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--card2);
}

.current .arrows{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
  margin:4px auto 12px;
  max-width:520px;
}

.dot{
  width:100%;
  aspect-ratio:1;
  max-width:58px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:var(--text);
  background:var(--card3);
  border:1px solid var(--line);
  font-size:15px;
  font-weight:900;
}

.current-score{
  color:var(--gold);
  font-size:27px;
  font-weight:900;
}

/* BUTTONS */
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content: center;
}

.btn{
  padding:12px 16px;
  color:#fff;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  border:0;
  border-radius:13px;
  font-weight:900;
  transition:.18s;
}

.btn.secondary{
  color:var(--text);
  background:var(--card2);
  border:1px solid var(--line);
}

.btn.danger{
  color:var(--red);
  background:rgba(255,95,120,.1);
  border:1px solid var(--red);
}

.btn.green{
  color:#fff;
  background:var(--green);
}

/* ENDS */
.ends{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.end{
  padding:10px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--card2);
}

.end b{
  display:block;
  color:var(--gold);
  font-size:24px;
  font-weight:900;
}

/* TOAST & MOTIVATION */
.toast{
  position:fixed;
  top:18px;
  left:50%;
  z-index:120;
  padding:12px 18px;
  color:var(--text);
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:13px;
  transform:translate(-50%,-80px);
  transition:.3s;
}
.toast.show{ transform:translate(-50%,0); }

/* RESPONSIVE */
@media(max-width:800px){
  .grid, .setup{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">🏹</div>
    <div>
      <h1>ARCHERY SCORE</h1>
      <p>هدف رمي تفاعلي ذكي</p>
    </div>
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="تغيير الثيم">🌙</button>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <button class="icon-btn" onclick="resetAll()">↻</button>
  </div>
</header>

<nav class="nav">
  <button class="active" onclick="showPage('score',this)">🎯 السكور</button>
  <button onclick="showPage('history',this)">📊 السجل</button>
</nav>

<!-- SCORE SECTION -->
<section id="score" class="page active">

<div class="card">
  <div class="card-title">
    <h2>إعداد الجولة والهدف</h2>
  </div>

  <div class="setup">
    <div class="field">
      <label>اسم الرامي</label>
      <input id="archerName" value="عمران">
    </div>

    <div class="field">
      <label>نوع الهدف التفاعلي</label>
      <select id="targetType" onchange="renderTarget()">
        <option value="10">هدف 10 خواتم (WA 10-Ring Full)</option>
        <option value="6">هدف 6 خواتم (WA 6-Ring Center)</option>
      </select>
    </div>

    <div class="field">
      <label>المسافة</label>
      <input id="distance" value="40 متر">
    </div>

    <div class="field">
      <label>عدد الأسهم الإجمالي</label>
      <select id="arrowCount">
        <option value="36">36 سهمًا · 6 جولات</option>
        <option value="72">72 سهمًا · 12 جولة</option>
      </select>
    </div>
  </div>
</div>

<div class="grid">

<div>
<div class="card">
  <div class="card-title">
    <h2>اضغط على الهدف لتسجيل السهم</h2>
    <span id="endLabel">الجولة 1 · السهم 1/6</span>
  </div>

  <!-- TARGET SVG AREA -->
  <div class="target-container" id="targetWrapper">
    <!-- SVG rendered dynamically -->
  </div>

  <div class="current">
    <div class="arrows">
      <div class="dot" id="a1">—</div>
      <div class="dot" id="a2">—</div>
      <div class="dot" id="a3">—</div>
      <div class="dot" id="a4">—</div>
      <div class="dot" id="a5">—</div>
      <div class="dot" id="a6">—</div>
    </div>
    <div class="current-score" id="currentEndScore">0</div>
  </div>

  <div class="actions">
    <button class="btn danger" onclick="addArrow(0, true)">M (خارج الهدف)</button>
    <button class="btn secondary" onclick="undoArrow()">⌫ تراجع</button>
    <button class="btn secondary" onclick="clearCurrentEnd()">مسح الجولة</button>
    <button class="btn green" onclick="finishSession()">حفظ وإنهاء</button>
  </div>
</div>

<div class="card">
  <div class="card-title">
    <h2>سجل الجولات</h2>
    <span id="endCount">0 / 6</span>
  </div>
  <div class="ends" id="ends"></div>
</div>

</div>

<div>
<div class="card">
  <div class="score-hero">
    <div class="total" id="total">0<small>/360</small></div>
    <div class="percent" id="percent">0.0%</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="tens">0</b><span>10</span></div>
    <div class="stat"><b id="nines">0</b><span>9</span></div>
    <div class="stat"><b id="eights">0</b><span>8</span></div>
    <div class="stat"><b id="avg">0.00</b><span>معدل السهم</span></div>
  </div>
</div>
</div>

</div>
</section>

<!-- HISTORY SECTION -->
<section id="history" class="page">
<div class="card">
  <div class="card-title">
    <h2>سجل النتائج</h2>
    <button class="btn danger" onclick="clearHistory()">مسح السجل</button>
  </div>
  <div id="historyList"></div>
</div>
</section>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

let soundEnabled = true;
let currentTheme = "dark";

let session = {
  arrows: [],
  ends: [],
  currentEnd: []
};

const $ = id => document.getElementById(id);

/* =========================
   THEME TOGGLE
========================= */
function toggleTheme() {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", currentTheme);
  $("themeBtn").textContent = currentTheme === "dark" ? "🌙" : "☀️";
}

/* =========================
   TARGET RENDERING (10 vs 6 RINGS)
========================= */
function renderTarget() {
  const type = $("targetType").value;
  const wrapper = $("targetWrapper");

  if (type === "10") {
    // 10-Ring Target SVG
    wrapper.innerHTML = `
      <svg class="target-svg" viewBox="0 0 400 400">
        <!-- White Rings (1 & 2) -->
        <circle class="target-ring" cx="200" cy="200" r="190" fill="#ffffff" stroke="#000" stroke-width="1.5" onclick="addArrow(1)"/>
        <circle class="target-ring" cx="200" cy="200" r="171" fill="#ffffff" stroke="#000" stroke-width="1.5" onclick="addArrow(2)"/>
        <!-- Black Rings (3 & 4) -->
        <circle class="target-ring" cx="200" cy="200" r="152" fill="#1e293b" stroke="#fff" stroke-width="1" onclick="addArrow(3)"/>
        <circle class="target-ring" cx="200" cy="200" r="133" fill="#1e293b" stroke="#fff" stroke-width="1" onclick="addArrow(4)"/>
        <!-- Blue Rings (5 & 6) -->
        <circle class="target-ring" cx="200" cy="200" r="114" fill="#0099ff" stroke="#000" stroke-width="1" onclick="addArrow(5)"/>
        <circle class="target-ring" cx="200" cy="200" r="95" stroke="#000" stroke-width="1" fill="#0099ff" onclick="addArrow(6)"/>
        <!-- Red Rings (7 & 8) -->
        <circle class="target-ring" cx="200" cy="200" r="76" fill="#ff334b" stroke="#000" stroke-width="1" onclick="addArrow(7)"/>
        <circle class="target-ring" cx="200" cy="200" r="57" fill="#ff334b" stroke="#000" stroke-width="1" onclick="addArrow(8)"/>
        <!-- Gold Rings (9 & 10) -->
        <circle class="target-ring" cx="200" cy="200" r="38" fill="#ffd700" stroke="#000" stroke-width="1" onclick="addArrow(9)"/>
        <circle class="target-ring" cx="200" cy="200" r="19" fill="#ffd700" stroke="#000" stroke-width="1" onclick="addArrow(10)"/>
        <!-- X Center Inner Ring -->
        <circle cx="200" cy="200" r="9.5" fill="none" stroke="#000" stroke-width="1" pointer-events="none"/>
        <path d="M 195 200 L 205 200 M 200 195 L 200 205" stroke="#000" stroke-width="1" pointer-events="none"/>
      </svg>
    `;
  } else {
    // 6-Ring Center Target SVG (5 to 10)
    wrapper.innerHTML = `
      <svg class="target-svg" viewBox="0 0 300 300">
        <!-- Background outer frame for Miss zone -->
        <rect x="0" y="0" width="300" height="300" fill="none"/>
        <!-- Blue Ring (5 & 6) -->
        <circle class="target-ring" cx="150" cy="150" r="140" fill="#0099ff" stroke="#000" stroke-width="2" onclick="addArrow(5)"/>
        <circle class="target-ring" cx="150" cy="150" r="116" fill="#0099ff" stroke="#000" stroke-width="1.5" onclick="addArrow(6)"/>
        <!-- Red Rings (7 & 8) -->
        <circle class="target-ring" cx="150" cy="150" r="93" fill="#ff334b" stroke="#000" stroke-width="1.5" onclick="addArrow(7)"/>
        <circle class="target-ring" cx="150" cy="150" r="70" fill="#ff334b" stroke="#000" stroke-width="1.5" onclick="addArrow(8)"/>
        <!-- Gold Rings (9 & 10) -->
        <circle class="target-ring" cx="150" cy="150" r="46" fill="#ffd700" stroke="#000" stroke-width="1.5" onclick="addArrow(9)"/>
        <circle class="target-ring" cx="150" cy="150" r="23" fill="#ffd700" stroke="#000" stroke-width="1.5" onclick="addArrow(10)"/>
        <!-- X Center -->
        <circle cx="150" cy="150" r="11.5" fill="none" stroke="#000" stroke-width="1" pointer-events="none"/>
        <path d="M 145 150 L 155 150 M 150 145 L 150 155" stroke="#000" stroke-width="1" pointer-events="none"/>
      </svg>
    `;
  }
}

/* =========================
   NAVIGATION & UTILS
========================= */
function showPage(id, btn) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  $(id).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  $("soundBtn").textContent = soundEnabled ? "🔊" : "🔇";
}

let audioCtx = null;
function playTone(freq, duration = 0.15) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

/* =========================
   SCORE LOGIC
========================= */
function maxEnds() { return Number($("arrowCount").value) / 6; }

function addArrow(value, miss = false) {
  if (session.ends.length >= maxEnds() || session.currentEnd.length >= 6) return;

  const scoreVal = miss ? 0 : value;
  session.currentEnd.push(scoreVal);
  session.arrows.push(scoreVal);

  if (scoreVal === 10) playTone(880, 0.2);
  else if (scoreVal >= 8) playTone(660, 0.15);
  else playTone(440, 0.12);

  renderCurrentEnd();
  updateScore();

  if (session.currentEnd.length === 6) {
    setTimeout(commitEnd, 300);
  }
}

function renderCurrentEnd() {
  for (let i = 0; i < 6; i++) {
    $("a" + (i + 1)).textContent = session.currentEnd[i] ?? "—";
  }
  $("currentEndScore").textContent = session.currentEnd.reduce((a, b) => a + b, 0);
  const next = Math.min(session.currentEnd.length + 1, 6);
  $("endLabel").textContent = `الجولة ${session.ends.length + 1} · السهم ${next}/6`;
}

function commitEnd() {
  if (session.currentEnd.length !== 6) return;
  const vals = [...session.currentEnd];
  const score = vals.reduce((a, b) => a + b, 0);

  session.ends.push({ values: vals, score });
  session.currentEnd = [];

  renderEnds();
  renderCurrentEnd();
  updateScore();
}

function undoArrow() {
  if (!session.currentEnd.length) return;
  session.currentEnd.pop();
  session.arrows.pop();
  renderCurrentEnd();
  updateScore();
}

function clearCurrentEnd() {
  session.arrows.splice(session.arrows.length - session.currentEnd.length);
  session.currentEnd = [];
  renderCurrentEnd();
  updateScore();
}

function renderEnds() {
  $("endCount").textContent = `${session.ends.length} / ${maxEnds()}`;
  $("ends").innerHTML = session.ends.map((e, i) => `
    <div class="end">
      <strong>جولة ${i + 1}</strong>
      <b>${e.score}</b>
      <div style="font-size:10px; color:var(--muted)">${e.values.join(" · ")}</div>
    </div>
  `).join("");
}

function updateScore() {
  const total = session.arrows.reduce((a, b) => a + b, 0);
  const max = Number($("arrowCount").value) * 10;

  $("total").innerHTML = `${total}<small>/${max}</small>`;
  $("percent").textContent = (total / max * 100).toFixed(1) + "%";

  $("tens").textContent = session.arrows.filter(x => x === 10).length;
  $("nines").textContent = session.arrows.filter(x => x === 9).length;
  $("eights").textContent = session.arrows.filter(x => x === 8).length;
  $("avg").textContent = session.arrows.length ? (total / session.arrows.length).toFixed(2) : "0.00";
}

function finishSession() {
  if (!session.arrows.length) return;
  const total = session.arrows.reduce((a, b) => a + b, 0);
  const max = Number($("arrowCount").value) * 10;

  saveHistory({
    name: $("archerName").value || "عمران",
    date: new Date().toLocaleString("ar-EG"),
    total, max,
    percent: (total / max * 100).toFixed(1)
  });

  toast("تم حفظ الجولة بنجاح!");
}

function saveHistory(item) {
  const h = JSON.parse(localStorage.getItem("archeryHistory") || "[]");
  h.unshift(item);
  localStorage.setItem("archeryHistory", JSON.stringify(h.slice(0, 30)));
  renderHistory();
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem("archeryHistory") || "[]");
  if (!h.length) {
    $("historyList").innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted)">لا توجد نتائج مسجلة.</div>';
    return;
  }
  $("historyList").innerHTML = h.map(x => `
    <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--line)">
      <div><b>${x.name}</b><br><small style="color:var(--muted)">${x.date}</small></div>
      <div style="text-align:left"><b style="color:var(--gold); font-size:18px">${x.total}/${x.max}</b><br><small>${x.percent}%</small></div>
    </div>
  `).join("");
}

function clearHistory() {
  localStorage.removeItem("archeryHistory");
  renderHistory();
}

function resetAll() {
  session = { arrows: [], ends: [], currentEnd: [] };
  renderEnds(); renderCurrentEnd(); updateScore();
}

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 2000);
}

// INIT
renderTarget();
renderCurrentEnd();
updateScore();
renderHistory();
</script>
</body>
</html>
